[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-frontier-fc"
version = "2.1.0"
description = "Squad construction as portfolio optimization: VAEP player ratings from event data, Markowitz-style selection under a wage budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faiyaz Enayet" }]
dependencies = ["beautifulsoup4>=4.11", 
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "plotly>=5.0",
]

[project.optional-dependencies]
# socceraction is the reference for the Stage 3 U06 action-value audit
# (analysis/action_audit.py). It pins numpy<2 and pandas<3, and its
# pandera 0.17 dependency only imports under multimethod 1.x, hence the
# multimethod pin. The audit tests run wherever dev dependencies are
# installed, including CI.
dev = ["pytest>=7.4", "socceraction>=1.5,<2", "multimethod<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
